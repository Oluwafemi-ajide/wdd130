<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An and CSS knowledge quiz.">
    <meta name="author" content="Oluwafemi Raphael Ajide">
    <title>Basic HTML and CSS Quiz</title>

    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>

            <div>
                <label for="q1">
                    1. What does the acronym CSS stand for?
                </label>
                <input type="text" id="q1" name="q1">
            </div>
            <div>
                <label for="q2">
                    2. How are id and class attributes selected in CSS?
                </label>
                <textarea id="q2" name="q2" row="4"></textarea>
            </div>
            <div>
                <label for="q3">
                    3. Which of the following is a valid CSS comment?
                </label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One...

                    </option>
                    <option value="img">img</option>
                    <option value="p">p</option>
                    <option value="h1">h1</option>
                </select>
            </div>
            <div>
                <label for="q4">
                    4. What is the bottom margin given this declaration?
                </label>
                <pre class="code-box"><code>margin: 10px 5px 15px;</code></pre>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">submit Quiz</button>
        </form>
    </main>

</body>

</html>
